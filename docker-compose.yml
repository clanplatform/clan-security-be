version: "3.9"

networks:
  clan-security-net:
    driver: bridge

volumes:
  redis_data:

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - clan-security-net
  depends_on:
    redis:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-common-env: &common-env
  # No local postgres container — all repos share one Postgres server
  # (admin-service-postgres, published on host port 5432, db clan_platform).
  DATABASE_URL: postgresql+asyncpg://postgres:root@host.docker.internal:5432/clan_platform
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
  JWT_ALGORITHM: HS256
  JWT_EXPIRY_MINUTES: 30
  ENVIRONMENT: ${ENVIRONMENT:-development}

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6386:6379"   # host port 6386: keeps one-redis-port-per-repo (6380-6385 taken)
    volumes:
      - redis_data:/data
    networks:
      - clan-security-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── compliance-and-governance ──────────────────────────────────────────────

  security-audit-trail-service:
    <<: *service-defaults
    build: ./services/security-audit-trail-service
    ports: ["8001:8001"]
    environment:
      <<: *common-env
      SERVICE_PORT: 8001

  security-gdpr-compliance-service:
    <<: *service-defaults
