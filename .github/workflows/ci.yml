name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - security-audit-trail-service
          - security-gdpr-compliance-service
          - security-pci-compliance-service
          - security-policy-management-service
          - security-sox-compliance-service
          - security-backup-encryption-service
          - security-data-classification-service
          - security-data-loss-prevention-service
          - security-data-masking-service
          - security-certificate-management-service
          - security-encryption-service
          - security-hsm-service
          - security-key-management-service
          - security-access-control-service
          - security-identity-verification-service
          - security-privilege-escalation-service
          - security-session-security-service
          - security-audit-service
          - security-forensics-service
          - security-log-analysis-service
          - security-monitoring-service
          - security-ddos-protection-service
          - security-firewall-management-service
          - security-intrusion-detection-service
          - security-network-monitoring-service
          - security-incident-response-service
          - security-penetration-testing-service
          - security-threat-detection-service
          - security-threat-intelligence-service
          - security-vulnerability-scanning-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check services/ --select E,F,I

  docker-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - security-audit-trail-service
          - security-access-control-service
          - security-encryption-service
          - security-monitoring-service
          - security-incident-response-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t clan-security/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
